name: Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build and preview only; do not create a tag or Release'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RELEASE_DRY_RUN: ${{ inputs.dry_run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.19.0'
          cache: npm
      - name: Validate version and generate bilingual notes
        run: node scripts/release.mjs prepare
        env:
          GH_TOKEN: ${{ github.token }}
      - run: npm ci
      - run: npm run verify
      - name: Pack the verified build
        run: npm pack --ignore-scripts --pack-destination work/release
      - name: Check package and create SHA256SUMS
        run: node scripts/release.mjs seal
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-bundle
          path: |
            work/release/*.tgz
            work/release/SHA256SUMS
            work/release/notes.md
            work/release/manifest.json
          if-no-files-found: error
          retention-days: 14

  verify-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.19.0'
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npm run test:ui

  publish:
    needs: [package, verify-windows]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.19.0'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-bundle
          path: work/release
      - name: Revalidate and publish the tested commit
        run: node scripts/release.mjs publish
        env:
          GH_TOKEN: ${{ github.token }}
